[project]
name = "rematricula"
version = "0.1.0"
description = "REST backend for a school enrollment-renewal payment flow"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyjwt>=2.10",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rematricula"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Importa direto da arvore de fontes: os testes nao dependem do pacote estar instalado.
pythonpath = [".", "src"]
markers = [
    "integration: exige credenciais reais; pulado por padrao",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "S", "C4", "SIM", "RUF"]
# N818 exige sufixo "Error" em excecoes; os erros de dominio sao nomeados em portugues.
ignore = ["S101", "N818"]

[tool.ruff.lint.per-file-ignores]
# S608 nos testes: o SQL de fixture e literal, sem entrada externa.
"tests/**" = ["S105", "S106", "S608"]

[tool.mypy]
python_version = "3.13"
files = ["src"]
strict = true
warn_unreachable = true

